# CareGuard 1차 배포용 구성: PostgreSQL 16 + Spring 백엔드 (+ 선택: coturn TURN 서버)
# 사용법은 deploy/README.md 참고. 값은 같은 폴더의 .env 에서 읽는다.
name: careguard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fall_detection
      POSTGRES_USER: careguard
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 빈 볼륨으로 처음 뜰 때만 실행된다. 기존 DB에는 docs/backend/migrations/ 를 수동 적용한다.
      - ../docs/backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careguard -d fall_detection"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../fall_detection_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/fall_detection
      DB_USER: careguard
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      CAREGUARD_LIVE_ENABLED: ${CAREGUARD_LIVE_ENABLED:-false}
      CAREGUARD_LIVE_ALLOW_REMOTE: ${CAREGUARD_LIVE_ALLOW_REMOTE:-false}
      CAREGUARD_LIVE_GUARDIAN_ALLOWLIST: ${CAREGUARD_LIVE_GUARDIAN_ALLOWLIST:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # JRE 이미지에 curl 이 없어 bash 의 /dev/tcp 로 확인한다 (/bin/sh 는 dash 라 bash 를 명시).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/patients?offset=0&limit=1 HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # WebRTC 중계 서버. 같은 Wi-Fi 가 아닌 폰끼리 영상이 붙으려면 필요하다.
  # 앱이 아직 TURN 주소를 받지 않으므로 지금은 서버만 준비해 둔다. `--profile turn` 으로 켠다.
  # TURN_PASSWORD 와 PUBLIC_IP 가 비어 있으면 coturn 이 시작 직후 종료되니 .env 를 먼저 채운다.
  coturn:
    image: coturn/coturn:4.6-alpine
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      TURN_REALM: ${TURN_REALM:-careguard}
      TURN_USER: ${TURN_USER:-careguard}
      TURN_PASSWORD: ${TURN_PASSWORD:-}
      PUBLIC_IP: ${PUBLIC_IP:-}
    command: >
      -c /etc/coturn/turnserver.conf
      --realm=${TURN_REALM:-careguard}
      --user=${TURN_USER:-careguard}:${TURN_PASSWORD:-}
      --external-ip=${PUBLIC_IP:-}

volumes:
  pgdata:
